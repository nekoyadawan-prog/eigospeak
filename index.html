<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日記から英語 音声トレーニング</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#1d2b27;--sub:#5d6f69;--line:#d3ddd8;--acc:#0b7a62;--on:#fff;--ok:#0b7a62;--okbg:#dff3ec;--ng:#b3392f;--ngbg:#fbe4e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a18;--card:#1b2623;--ink:#e6efeb;--sub:#97aaa3;--line:#2f3f3a;--acc:#4cc9a6;--on:#0b1a16;--ok:#4cc9a6;--okbg:#1e3a33;--ng:#f08a80;--ngbg:#3d211e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a18;--card:#1b2623;--ink:#e6efeb;--sub:#97aaa3;--line:#2f3f3a;--acc:#4cc9a6;--on:#0b1a16;--ok:#4cc9a6;--okbg:#1e3a33;--ng:#f08a80;--ngbg:#3d211e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.bar{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.jp{font-size:22px;font-weight:700;margin:0 0 6px}
.sub{font-size:13px;color:var(--sub);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mic{display:block;margin:18px auto 8px;width:104px;height:104px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:36px;font-weight:700}
.mic.on{background:var(--ng);color:#fff;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.st{text-align:center;font-size:14px;color:var(--sub);min-height:22px}
.heard{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bg);font-family:Georgia,serif;font-size:16px}
.hint{margin-top:10px;font-family:Georgia,serif;font-size:18px;letter-spacing:.02em;word-break:break-word}
.res{margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:700}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.ng{background:var(--ngbg);color:var(--ng)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--on);font-weight:700}
.btn.sec{background:transparent;color:var(--acc)}
.rate{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:14px}
.rate input{flex:1}
.score{font-size:28px;font-weight:700;margin:0 0 4px}
.list{display:grid;gap:8px;margin-top:12px}
.item{text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.item b{font-family:Georgia,serif;font-weight:400;font-size:16px;display:block}
.item span{font-size:13px;color:var(--sub)}
.item.miss{border-color:var(--ng)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>日記から英語 音声トレーニング</h1>
<div id="app"></div>
<div class="rate"><label for="r">読み上げ速度</label><input id="r" type="range" min="0.6" max="1.2" step="0.1" value="0.9"><span id="rv">0.9</span></div>
</main>
<script>
var ALL=[
{jp:"今日中に払わなきゃいけない",en:"I have to pay it by the end of today."},
{jp:"支払いを済ませる",en:"I need to take care of the payment."},
{jp:"健康保険料を払う",en:"I have to pay my health insurance premium."},
{jp:"あとで近所のローソンに寄ってくる",en:"I’ll swing by the Lawson near my place later."},
{jp:"スーパーでお酒を買ってくる",en:"I’ll pick up some alcohol at the supermarket."},
{jp:"ジョギングにも行かなきゃ",en:"I also need to go for a jog."},
{jp:"そうだ、忘れてた",en:"Oh, I almost forgot."},
{jp:"小遣い帳の記録がまだだった",en:"I haven’t updated my spending log yet."},
{jp:"急いでやらなきゃ",en:"I need to hurry up and get it done."},
{jp:"YouTubeで株の勉強もしなきゃ",en:"I also have to study stocks on YouTube."},
{jp:"部屋の床掃除をしなきゃ",en:"I need to clean the floor in my room."},
{jp:"ゴミ捨てをしなきゃ",en:"I have to take out the trash."},
{jp:"筋トレもしなきゃ",en:"I also need to do some strength training."},
{jp:"遊んでいる場合ではない",en:"This is no time to play around."},
{jp:"時間は貴重だ",en:"Time is precious."},
{jp:"どんどん英語の勉強をしなきゃ",en:"I need to keep studying English."},
{jp:"早くしゃべれるようにならなきゃ",en:"I need to be able to speak English soon."},
{jp:"（コンビニ）床を掃除して",en:"Please clean the floor.",alt:["Please mop the floor.","Could you clean the floor?"]},
{jp:"（コンビニ）フライヤーを掃除して",en:"Please clean the fryer."},
{jp:"（コンビニ）脂がすごく黒い時は油交換もお願い",en:"If the oil is very dark, please change it too.",alt:["If the oil looks really dark, please change it as well."]},
{jp:"（コンビニ）前陳して",en:"Please face the shelves.",alt:["Please pull the products forward."]},
{jp:"（コンビニ）廃棄を取ろう",en:"Let’s pull the expired items.",alt:["Let’s take the expired products off the shelves."]},
{jp:"（コンビニ）ゴミを出してきて",en:"Please take out the trash.",alt:["Could you take out the trash?","Please take out the garbage."]},
{jp:"（コンビニ）値引きシールを貼ろう",en:"Let’s put the discount stickers on."},
{jp:"（コンビニ）冷凍食品の納品がもうすぐ来るよ",en:"The frozen food delivery is coming soon."},
{jp:"（コンビニ）レジお願いします",en:"Could you help at the register, please?",alt:["Register, please!","Could you cover the register?"]},
{jp:"（コンビニ）ウォークの補充をお願い",en:"Please restock the walk-in cooler.",alt:["Please restock the cooler."]},
{jp:"（おまけ）レジで：この請求書を払いたいのですが",en:"I’d like to pay this bill, please."}
];
var app=document.getElementById("app"),rate=document.getElementById("r"),rv=document.getElementById("rv");
var Q=[],i=0,tries=0,hits=[],rec=null,listening=false,voice=null,ac=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
rate.oninput=function(){rv.textContent=rate.value};
function pickVoice(){try{var v=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang)});voice=v.filter(function(x){return /US/i.test(x.lang)})[0]||v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=parseFloat(rate.value);speechSynthesis.speak(u)}catch(e){}}
function tone(f,t,d,ty){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=ty||"square";o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
function good(){[523,659,784,1047,1319].forEach(function(f,k){tone(f,k*.08,.18)})}
function bad(){tone(160,0,.35,"sawtooth");tone(120,.15,.4,"sawtooth")}
var CON={"i'll":"i will","i'd":"i would","i'm":"i am","haven't":"have not","didn't":"did not","don't":"do not","it's":"it is","can't":"can not"};
function norm(s){s=s.toLowerCase().replace(/[’‘]/g,"'");Object.keys(CON).forEach(function(k){s=s.split(k).join(CON[k])});return s.replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(function(w){return w&&w!=="please"})}
function judge(heard,target){var tw=norm(target),hw=norm(heard),cnt={};hw.forEach(function(w){cnt[w]=(cnt[w]||0)+1});var fl=tw.map(function(w){if(cnt[w]>0){cnt[w]--;return true}return false});var n=fl.filter(Boolean).length;return{sc:n/tw.length,fl:fl,tw:tw}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function start(list){Q=shuffle(list);i=0;hits=[];next()}
function intro(){
 var ok=!!SR;
 app.innerHTML='<div class="card"><p class="jp">日本語を見て、英語で言ってみよう</p><p class="sub">マイクボタンを押して英語を話します。うまく言えないときは、言えた単語だけが表示されるヒントが出ます。2回まちがえると答えを読み上げます。</p>'+(ok?'':'<div class="res ng">このブラウザは音声認識に対応していません。ChromeかSafariで開いてください。</div>')+'<div class="row"><button class="btn" id="go">スタート（'+ALL.length+'問）</button></div></div>';
 document.getElementById("go").onclick=function(){tone(440,0,.05);start(ALL.slice())};
}
function next(){
 if(i>=Q.length)return result();
 tries=0;var q=Q[i];
 app.innerHTML='<div class="bar"><span>'+(i+1)+' / '+Q.length+'</span><span>成功 '+hits.filter(Boolean).length+'</span></div><div class="prog"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card"><p class="jp">'+esc(q.jp)+'</p><p class="sub">英語でどう言う？</p><button class="mic" id="mic" aria-label="話す">🎤</button><div class="st" id="st">タップして話す</div><div id="out"></div><div class="row"><button class="btn sec" id="hear">🔊 お手本を聞く</button><button class="btn sec" id="skip">答えを見る</button></div></div>';
 document.getElementById("mic").onclick=listen;
 document.getElementById("hear").onclick=function(){say(q.en)};
 document.getElementById("skip").onclick=function(){reveal(false)};
}
function listen(){
 if(!SR){document.getElementById("st").textContent="音声認識に対応していません";return}
 if(listening){try{rec.stop()}catch(e){}return}
 try{speechSynthesis.cancel()}catch(e){}
 rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=3;
 var mic=document.getElementById("mic"),st=document.getElementById("st"),got=null;
 rec.onstart=function(){listening=true;mic.classList.add("on");st.textContent="聞き取り中…話してください"};
 rec.onresult=function(e){got=[];for(var k=0;k<e.results[0].length;k++)got.push(e.results[0][k].transcript)};
 rec.onerror=function(e){st.textContent=e.error==="not-allowed"?"マイクが許可されていません":"うまく聞き取れませんでした。もう一度どうぞ"};
 rec.onend=function(){listening=false;mic.classList.remove("on");if(got)check(got)};
 try{rec.start()}catch(e){}
}
function check(alts){
 var q=Q[i],best=null,bh="";
 alts.forEach(function(h){[q.en].concat(q.alt||[]).forEach(function(t){var j=judge(h,t);if(!best||j.sc>best.sc){best=j;bh=h}})});
 tries++;
 var out=document.getElementById("out"),st=document.getElementById("st");
 st.textContent="";
 var h='<div class="heard">あなた：'+esc(bh)+'</div>';
 if(best.sc>=0.85){good();hits[i]=true;h+='<div class="res ok">🎉 ナイス！ '+Math.round(best.sc*100)+'%</div><div class="hint">'+esc(q.en)+'</div><div class="row"><button class="btn" id="nx">'+(i+1>=Q.length?"結果を見る":"次へ")+'</button></div>';out.innerHTML=h;say(q.en);document.getElementById("nx").onclick=function(){i++;next()};return}
 bad();
 if(tries>=2){out.innerHTML=h;reveal(false);return}
 var hint=best.tw.map(function(w,k){return best.fl[k]?w:"_".repeat(w.length)}).join(" ");
 h+='<div class="res ng">おしい！ '+Math.round(best.sc*100)+'%　もう一度</div><div class="hint">ヒント：'+esc(hint)+'</div>';
 out.innerHTML=h;
}
function reveal(ok){
 var q=Q[i];if(!ok)hits[i]=false;
 var out=document.getElementById("out");
 var keep=out.querySelector(".heard");
 out.innerHTML=(keep?keep.outerHTML:"")+'<div class="res ng">正解はこちら</div><div class="hint">'+esc(q.en)+'</div><div class="row"><button class="btn sec" id="ag">🔊 もう一度聞く</button><button class="btn" id="nx">'+(i+1>=Q.length?"結果を見る":"次へ")+'</button></div>';
 say(q.en);
 document.getElementById("ag").onclick=function(){say(q.en)};
 document.getElementById("nx").onclick=function(){i++;next()};
}
function result(){
 var n=hits.filter(Boolean).length;
 var h='<div class="card"><p class="score">'+n+' / '+Q.length+'</p><p class="sub">タップすると読み上げます</p><div class="list">';
 Q.forEach(function(q,k){h+='<button class="item'+(hits[k]?'':' miss')+'" data-k="'+k+'"><b>'+(hits[k]?'✅':'❌')+' '+esc(q.en)+'</b><span>'+esc(q.jp)+'</span></button>'});
 h+='</div><div class="row"><button class="btn" id="again">全部もう一度</button>'+(n<Q.length?'<button class="btn sec" id="miss">できなかった問題だけ</button>':'')+'</div></div>';
 app.innerHTML=h;
 if(n===Q.length)good();
 app.querySelectorAll(".item").forEach(function(b){b.onclick=function(){say(Q[+b.dataset.k].en)}});
 document.getElementById("again").onclick=function(){start(ALL.slice())};
 var m=document.getElementById("miss");if(m)m.onclick=function(){start(Q.filter(function(q,k){return !hits[k]}))};
}
intro();
</script>
</body>
</html>
